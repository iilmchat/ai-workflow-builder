name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: devpass123
          POSTGRES_DB: workflow_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # KI-011: REDIS_URL обязателен в validateEnv(). Unit-тесты не поднимают
      # AppModule, но e2e (test/app.e2e-spec.ts) — поднимают: без Redis сервиса
      # любой e2e-прогон на CI падал бы на валидации env до первого теста.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # KI-292 / v0.11 S15: `nest build` обязан копировать assets шаблонов в
      # dist. Без этого гейта регрессия (убрали assets из nest-cli.json) снова
      # пройдёт незамеченной — Docker-обход удалён.
      - name: Check dist templates asset
        run: test -f dist/templates/text-llm.json

      # KI-317: tsconfig.build.json исключает **/*.spec.ts, а vitest типы не
      # проверяет — спеки валидируются отдельным tsconfig.spec.json.
      - name: Typecheck
        run: pnpm typecheck

      # KI-497/KI-344: реестр KI и его сводка обязаны сходиться по grep
      # (RULES 3.20) — расхождение блокирует merge.
      - name: Check KNOWN_ISSUES summary
        run: pnpm check:known-issues

      # KI-610: панели дашборда обязаны ссылаться на реальные метрики.
      - name: Check Grafana dashboard metrics
        run: pnpm check:grafana

      # KI-298: гейт паритета схемы (src/db/schema-parity.spec.ts) читает
      # information_schema из services.postgres, поэтому схему нужно применить
      # до тестов — иначе БД пуста и гейт красный («таблица отсутствует в БД»).
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://workflow:devpass123@localhost:5432/workflow_builder

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgres://workflow:devpass123@localhost:5432/workflow_builder
          # R6.1a: env валидируется Zod при старте приложения, JWT_SECRET обязателен.
          JWT_SECRET: ci-secret-at-least-32-characters-long
          AUTH_DISABLED: 'false'
          # KI-011: обязателен для validateEnv() при подъёме AppModule в e2e.
          REDIS_URL: redis://127.0.0.1:6379

      # KI-343: e2e-спек (`*.e2e-spec.ts`) не входит в `pnpm test`.
      - name: Check markdown links
        run: pnpm check:links

      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://workflow:devpass123@localhost:5432/workflow_builder
          JWT_SECRET: ci-secret-at-least-32-characters-long
          AUTH_DISABLED: 'false'
          REDIS_URL: redis://127.0.0.1:6379

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test