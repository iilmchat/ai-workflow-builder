name: Docker Publish

# Публикация образа в GitHub Container Registry:
# - push в main — latest + sha-<short> + v<version из package.json>;
# - push тега v* — то же (version берётся из package.json, не из ref);
# - workflow_dispatch — ручной перезалив.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      # checkout приватного репозитория
      contents: read
      # push в ghcr.io от имени github-actions
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Версия — единственный источник правды package.json, а не имя git-тега:
      # так образ, собранный из main, тоже получает корректный vX.Y.Z.
      - name: Read version from package.json
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action приводит имя образа к нижнему регистру (требование
      # GHCR) и генерирует sha-<short> для type=sha.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=v${{ steps.pkg.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # load нужен, чтобы шаг ниже проверил содержимое образа до релиза.
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Регресс-проверка состава runtime-образа: файлы, которые читаются в
      # рантайме, но не участвуют в сборке (api-prefixes.json), легко забыть
      # скопировать в стадию runner — тогда контейнер падает на старте.
      - name: Verify runtime files in image
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}"
          echo "Проверяем ${IMAGE}"
          docker run --rm --entrypoint sh "${IMAGE}" -c '
            set -e
            for f in /app/api-prefixes.json /app/dist/main.js /app/dist/migrate.js /app/drizzle /app/web/dist/index.html; do
              if [ ! -e "$f" ]; then
                echo "missing in image: $f"
                exit 1
              fi
            done
            echo "runtime files: ok"
          '
