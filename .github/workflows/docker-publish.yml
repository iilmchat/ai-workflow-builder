name: Docker Publish

# Публикация образа в GitHub Container Registry:
# - push в main — latest + sha-<short> + v<version из package.json>;
# - push тега v* — то же (version берётся из package.json, не из ref);
# - workflow_dispatch — ручной перезалив.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      # checkout приватного репозитория
      contents: read
      # push в ghcr.io от имени github-actions
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Версия — единственный источник правды package.json, а не имя git-тега:
      # так образ, собранный из main, тоже получает корректный vX.Y.Z.
      - name: Read version from package.json
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action приводит имя образа к нижнему регистру (требование
      # GHCR) и генерирует sha-<short> для type=sha.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=v${{ steps.pkg.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
